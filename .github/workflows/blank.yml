name: Build JPW LSPosed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Arrange Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/jpwreach/lsposed
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          
          # Move Kotlin/Java source files
          find . -maxdepth 1 -name "*.kt" -exec cp {} app/src/main/java/com/jpwreach/lsposed/ \;
          find . -maxdepth 1 -name "*.java" -exec cp {} app/src/main/java/com/jpwreach/lsposed/ \;
          
          # Copy Manifest and resources if present in root
          [ -f AndroidManifest.xml ] && cp AndroidManifest.xml app/src/main/
          [ -f xposed_init ] && cp xposed_init app/src/main/assets/
          [ -f strings.xml ] && cp strings.xml app/src/main/res/values/
          [ -f arrays.xml ] && cp arrays.xml app/src/main/res/values/
          [ -f build.gradle ] && cp build.gradle app/
          [ -f build.gradle.kts ] && cp build.gradle.kts app/

      - name: Build Debug APK with Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run AssembleDebug
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jpw-lsposed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
