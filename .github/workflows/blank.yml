name: Build JPW LSPosed APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Arrange Android Project Structure
        run: |
          mkdir -p app/src/main/java/com/jpwreach/lsposed
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/values
          
          # Copy Kotlin source files
          cp JpwHook.kt app/src/main/java/com/jpwreach/lsposed/
          cp MainActivity.kt app/src/main/java/com/jpwreach/lsposed/
          
          # Copy Manifest, assets, and values
          cp AndroidManifest.xml app/src/main/
          cp xposed_init app/src/main/assets/
          cp strings.xml app/src/main/res/values/
          cp arrays.xml app/src/main/res/values/
          
          # Pick the app-level build.gradle.kts (the one containing 'android {')
          for f in build.gradle*.kts; do
            if grep -q "android {" "$f"; then
              cp "$f" app/build.gradle.kts
            fi
          done
          
          # Fallback if none matched 'android {'
          if [ ! -f app/build.gradle.kts ]; then
            cp build.gradle.kts app/build.gradle.kts
          fi
          
          # Remove duplicate gradle scripts from root so root only acts as parent project
          rm -f build.gradle*.kts

      - name: Build Debug APK with Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run AssembleDebug
        run: gradle :app:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jpw-lsposed-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
